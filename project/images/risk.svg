<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Risk management chart illustration</title>
  <desc id="desc">A chart showing balanced risk levels for investments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10231a" />
      <stop offset="100%" stop-color="#24533f" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="28" />
  <rect x="120" y="90" width="560" height="320" rx="20" fill="#f5f8f0" />
  <g stroke="#204733" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M180 350h440" />
    <path d="M180 350V160" />
  </g>
  <g fill="#5abf8a">
    <rect x="220" y="280" width="70" height="70" rx="8" />
    <rect x="330" y="240" width="70" height="110" rx="8" />
    <rect x="440" y="205" width="70" height="145" rx="8" />
    <rect x="550" y="170" width="70" height="180" rx="8" />
  </g>
  <g fill="#204733" font-family="Verdana, sans-serif" font-size="24" text-anchor="middle">
    <text x="255" y="385">Low</text>
    <text x="365" y="385">Med</text>
    <text x="475" y="385">High</text>
    <text x="585" y="385">Max</text>
  </g>
</svg>
