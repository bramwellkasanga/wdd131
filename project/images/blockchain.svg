<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Blockchain network illustration</title>
  <desc id="desc">Connected blocks representing a distributed ledger.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2338" />
      <stop offset="100%" stop-color="#123b52" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="28" />
  <g fill="none" stroke="#69d0ff" stroke-width="4" opacity="0.8">
    <path d="M180 150h130" />
    <path d="M360 150h130" />
    <path d="M250 210v80" />
    <path d="M430 210v80" />
    <path d="M300 330h130" />
  </g>
  <g fill="#f4b400" stroke="#ffdf85" stroke-width="4">
    <rect x="90" y="110" width="90" height="90" rx="12" />
    <rect x="270" y="110" width="90" height="90" rx="12" />
    <rect x="450" y="110" width="90" height="90" rx="12" />
    <rect x="205" y="290" width="90" height="90" rx="12" />
    <rect x="385" y="290" width="90" height="90" rx="12" />
  </g>
  <g fill="#0b1d2a" font-family="Verdana, sans-serif" font-size="22" text-anchor="middle">
    <text x="135" y="165">B1</text>
    <text x="315" y="165">B2</text>
    <text x="495" y="165">B3</text>
    <text x="250" y="345">B4</text>
    <text x="430" y="345">B5</text>
  </g>
</svg>
