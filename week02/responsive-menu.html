<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Menu</title>
    <meta name="description" content="Responsive hamburger menu example for WDD 131.">
    <meta name="author" content="Bramwell Kasanga">
    <link rel="stylesheet" href="styles/responsive-menu.css">
  </head>
  <body>
    <header>
      <nav>
        <button id="menu-button" aria-label="Toggle navigation">☰</button>
        <div id="menu" class="menu">
          <a href="#" class="active">Home</a>
          <a href="#">About</a>
          <a href="#">Projects</a>
          <a href="#">Contact</a>
        </div>
      </nav>
    </header>

    <main>
      <h1>Responsive Menu Example</h1>
      <p>This menu collapses on smaller screens and expands when the hamburger button is clicked.</p>
    </main>

    <script src="scripts/responsive-menu.js"></script>
  </body>
</html>
