<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Submitted | WDD 131</title>
  <meta name="description" content="Product review submission confirmation page with review count tracking.">
  <meta name="author" content="Bramwell Kasanga">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script defer src="scripts/review.js"></script>
  <script defer src="scripts/getdates.js"></script>
</head>
<body>
  <main class="confirmation-main">
    <section class="confirmation-card" aria-live="polite">
      <p class="eyebrow">Submission Complete</p>
      <h1>Thanks for your review!</h1>
      <p class="lead">Your feedback was recorded successfully.</p>
      <p class="counter">Reviews submitted so far: <strong id="reviewCount">0</strong></p>

      <div class="summary-block" id="submissionSummary">
        <h2>Submission Summary</h2>
        <ul id="summaryList"></ul>
      </div>

      <a class="back-link" href="form.html">Submit another review</a>
    </section>
  </main>

  <footer class="page-footer">
    <p>&copy; <span id="currentYear"></span> Bramwell Kasanga | South Africa</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
